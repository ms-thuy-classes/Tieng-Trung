  </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-6 space-y-8" id="mainContent">
  <div id="loadingPlaceholder" class="loading-container">
    <div class="text-4xl mb-3">⏳</div>
    <p class="text-purple-600 font-semibold">Đang tải bài học...</p>
  </div>
</main>

<!-- PRACTICE MODAL -->
<div class="modal-overlay" id="gameModal">
  <div class="modal-box">
    <div class="flex items-center justify-between mb-5"><h3 id="gameTitle" class="font-black text-xl text-purple-700"></h3><button onclick="closeModal()" class="w-9 h-9 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-500 font-bold text-lg flex items-center justify-center">✕</button></div>
    <div id="gameProgressWrap" class="mb-4"><div class="flex justify-between text-xs font-bold text-gray-400 mb-1"><span id="gameProgressLabel">Câu 1 / 30</span><span id="gameScoreLabel">Đúng: 0</span></div><div class="w-full h-2 bg-gray-100 rounded-full overflow-hidden"><div id="gameProgressBar" class="progress-bar-fill" style="width:0%"></div></div></div>
    <div id="gameContent"></div>
  </div>
</div>

<!-- ===== TEST OVERLAY ===== -->
<div id="testOverlay">
  <!-- Name screen -->
  <div id="testNameScreen" class="test-name-screen">
    <button onclick="closeTest()" class="self-start mb-6 flex items-center gap-2 text-purple-500 font-bold text-sm hover:text-purple-700 transition">
      <span class="text-lg">←</span> Quay lại bài học
    </button>
    <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-amber-300 to-orange-400 flex items-center justify-center text-3xl shadow-lg mb-6">📝</div>
    <h2 class="font-black text-3xl text-purple-700 mb-2 text-center">Bài Kiểm Tra</h2>
    <p class="text-gray-500 text-center mb-8 font-semibold" id="testSubtitle">Kiểm tra toàn bộ từ vựng bài học</p>
    <div class="w-full bg-white rounded-2xl p-6 shadow-sm border border-purple-100 mb-6">
      <div class="flex items-center gap-3 mb-2">
        <span class="text-2xl">👤</span>
        <label class="font-black text-purple-700">Họ tên học viên</label>
      </div>
      <input id="testStudentName" class="name-input" placeholder="Nhập tên của bạn..." />
      <div class="mt-4 grid grid-cols-3 gap-3 text-center text-sm">
        <div class="bg-purple-50 rounded-xl p-3">
          <div class="text-2xl mb-1">📝</div>
          <div class="font-bold text-purple-700">50%</div>
          <div class="text-gray-500 text-xs">Trắc nghiệm</div>
        </div>
        <div class="bg-amber-50 rounded-xl p-3">
          <div class="text-2xl mb-1">🔀</div>
          <div class="font-bold text-amber-700">25%</div>
          <div class="text-gray-500 text-xs">Sắp xếp</div>
        </div>
        <div class="bg-green-50 rounded-xl p-3">
          <div class="text-2xl mb-1">🈳</div>
          <div class="font-bold text-green-700">25%</div>
          <div class="text-gray-500 text-xs">Dịch câu</div>
        </div>
      </div>
    </div>
    <button onclick="startTest()" class="start-test-btn w-full">🚀 Bắt đầu kiểm tra</button>
  </div>

  <!-- Question screen -->
  <div id="testQuestionScreen" style="display:none; flex-direction:column; min-height:100vh;">
    <div class="test-header">
      <button onclick="confirmExitTest()" title="Thoát" style="background:none;border:none;cursor:pointer;font-size:1.3rem;color:#a78bfa;padding:0 4px;">←</button>
      <div class="test-progress-track">
        <div class="test-progress-fill" id="testProgressFill" style="width:0%"></div>
      </div>
      <span id="testQCounter" class="font-black text-purple-500 text-sm whitespace-nowrap">1 / 10</span>
      <span id="testScoreLive" class="font-black text-green-600 text-sm whitespace-nowrap">✓ 0</span>
    </div>
    <div style="flex:1; padding: 20px 16px; display:flex; align-items:flex-start; justify-content:center;">
      <div class="test-card" id="testQuestionCard"></div>
    </div>
  </div>

  <!-- Summary screen -->
  <div id="testSummaryScreen" style="display:none;">
    <div class="test-name-screen" style="max-width:600px;">
      <button onclick="closeTest()" class="self-start mb-4 flex items-center gap-2 text-purple-500 font-bold text-sm hover:text-purple-700 transition">
        <span class="text-lg">←</span> Quay lại bài học
      </button>
      <div class="w-full bg-white rounded-2xl p-6 shadow-sm border border-purple-100 mb-4 text-center">
        <p class="text-sm font-bold text-gray-400 mb-1" id="summStudentName"></p>
        <div class="summary-score-ring" id="summRing">
          <div class="summary-score-inner">
            <div class="font-black text-3xl text-purple-700" id="summPct">--%</div>
            <div class="text-xs text-gray-400 font-bold">Điểm</div>
          </div>
        </div>
        <div class="grid grid-cols-3 gap-3 mt-4">
          <div class="bg-purple-50 rounded-xl p-3">
            <div class="font-black text-2xl text-purple-700" id="summTotal">-</div>
            <div class="text-xs text-gray-500 font-semibold">Tổng câu</div>
          </div>
          <div class="bg-green-50 rounded-xl p-3">
            <div class="font-black text-2xl text-green-700" id="summCorrect">-</div>
            <div class="text-xs text-gray-500 font-semibold">Câu đúng</div>
          </div>
          <div class="bg-red-50 rounded-xl p-3">
            <div class="font-black text-2xl text-red-600" id="summWrong">-</div>
            <div class="text-xs text-gray-500 font-semibold">Câu sai</div>
          </div>
        </div>
        <div class="mt-4 text-center">
          <span id="summEmoji" class="text-5xl">🏆</span>
          <p id="summMsg" class="font-black text-lg text-purple-700 mt-2"></p>
        </div>
      </div>
      <div id="summReviewSection" class="w-full"></div>
      <div class="flex gap-3 w-full mt-2">
        <button onclick="restartTest()" class="flex-1 py-3 rounded-xl bg-gradient-to-r from-purple-400 to-blue-400 text-white font-black shadow">🔄 Làm lại</button>
        <button onclick="closeTest()" class="flex-1 py-3 rounded-xl bg-white border-2 border-purple-200 text-purple-600 font-black">← Về bài học</button>
      </div>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
